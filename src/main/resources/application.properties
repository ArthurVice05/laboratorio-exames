spring.application.name=laboratorio-exames

# Sem perfil informado, sobe o produtor
spring.profiles.default=produtor

# Nome deste processo nos logs e nos registros (a 2ª instância de Indicadores sobrescreve)
app.instancia=${spring.profiles.active:produtor}

# Pasta dos registros estruturados (efeitos verificáveis)
app.dados-dir=dados

# Conexão com o RabbitMQ (variáveis de ambiente opcionais)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:lab}
spring.rabbitmq.password=${RABBITMQ_PASS:lab123}

# Produtor: confirmação do broker e retorno de mensagem sem fila
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Consumidores: ACK manual (só depois do efeito gravado), uma mensagem por vez,
# e mensagem rejeitada NÃO volta para a fila (vai para a DLQ)
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Mantém o fuso (-03:00) das datas ao ler o JSON
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
spring.jackson.time-zone=America/Sao_Paulo

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %msg%n
logging.level.org.springframework.amqp.rabbit.connection=WARN
